{{ $dateLabel := .Param "dateLabel" | default "Published" }}

<header>
  <h1>{{ .Title }}</h1>

  {{ with .Description }}<p>{{ . }}</p>{{ end }}

  {{ if .IsPage }}
  <dl>
    {{ with .Date }}
      <dt>{{ $dateLabel }}</dt>
      <dd>
        <time datetime="{{ .Format "2006-01-02" }}">{{ .Format "2 January 2006" }}</time>
      </dd>
    {{ end }}
  </dl>
  {{ end }}
</header>
