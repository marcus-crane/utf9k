{{ if eq .Type "alert" }}
  <blockquote data-alert="{{ .AlertType }}">
    <p>
      <strong>{{ with .AlertTitle }}{{ . }}{{ else }}{{ or (i18n .AlertType) (title .AlertType) }}{{ end }}</strong>
    </p>
    {{ .Text }}
  </blockquote>
{{ else }}
  <blockquote>
    {{ .Text }}
  </blockquote>
{{ end }}
