{{ define "main" }}
  {{ partial "header.html" . }}
  <article>
    {{ if and .Fragments.Headings (ne .Params.toc false) }}
      <details>
        <summary>Contents</summary>
        {{ $.TableOfContents }}
      </details>
    {{ end }}

    {{ .Content | replaceRE `<div class="footnotes" role="doc-endnotes">\s*<hr>` `<div class="footnotes" role="doc-endnotes"><h2 id="footnotes">Footnotes</h2>` | safeHTML }}

    {{ if and (eq .Section "blog") (not .Draft) }}
    <script type="application/json">
    {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "headline": "{{ .Title }}",
      "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" }}
    }
    </script>
    {{ end }}
  </article>
{{ end }}
